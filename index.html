<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Battle - Real Time Quiz Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Error Indicator -->
        <div class="error-indicator hidden" id="errorIndicator"></div>

        <!-- Home Screen -->
        <div class="screen active" id="homeScreen">
            <div class="home-screen">
                <h1 class="logo">5ARBGA Battle</h1>
                <p class="tagline">Real-time multiplayer quiz game</p>
                
                <div class="button-group">
                    <button onclick="showCreateRoom()">Create Room</button>
                    <button class="secondary" onclick="showJoinRoom()">Join Room</button>
                    <button class="secondary" onclick="startSoloGame()">Solo Mode</button>
                </div>

                <div id="createRoomForm" class="hidden glass-card">
                    <h2 style="margin-bottom: 20px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; font-size: 14px;">Create Room - Select Categories</h2>
                    <div class="category-selector" id="categorySelector"></div>
                    <p style="color: var(--text-muted); font-size: 12px; margin-top: 10px;">Choose one or more categories</p>
                    <div class="input-group">
                        <input type="text" id="hostName" placeholder="Your name" maxlength="20">
                    </div>
                    <div class="input-group">
                        <select id="timerSelect">
                            <option value="20">20 seconds</option>
                            <option value="30" selected>30 seconds</option>
                            <option value="45">45 seconds</option>
                            <option value="60">1 minute</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <button onclick="createRoom()">Create Room</button>
                        <button class="secondary" onclick="hideCreateRoom()">Back</button>
                    </div>
                </div>

                <div id="joinRoomForm" class="hidden glass-card">
                    <h2 style="margin-bottom: 20px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; font-size: 14px;">Join Room</h2>
                    <div class="input-group">
                        <input type="text" id="joinRoomCode" placeholder="Room code" maxlength="6" style="text-transform: uppercase;">
                    </div>
                    <div class="input-group">
                        <input type="text" id="playerName" placeholder="Your name" maxlength="20">
                    </div>
                    <div class="input-group">
                        <button onclick="joinRoom()">Join Room</button>
                        <button class="secondary" onclick="hideJoinRoom()">Back</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lobby Screen -->
        <div class="screen" id="lobbyScreen">
            <div class="glass-card lobby-info">
                <h2>Room: <span id="lobbyRoomCode" style="color: var(--text-primary); font-weight: 600;"></span></h2>
                <p>Waiting for players... (<span id="playerCount">1</span>/10)</p>
                <p style="margin-top: 10px; font-size: 11px; color: var(--text-muted);">
                    Categories: <span id="lobbyCategories" style="color: var(--text-secondary);"></span>
                </p>
                <div class="player-list" id="lobbyPlayerList"></div>
            </div>
            
            <div id="hostControlsLobby" class="hidden">
                <button onclick="startGame()" style="width: 100%; margin-top: 20px;">Start Game</button>
            </div>
            
            <div id="playerWaitingMessage" class="hidden glass-card">
                <p style="text-align: center; margin-top: 20px; font-size: 12px; letter-spacing: 1px; color: var(--text-muted);">Waiting for host to start...</p>
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Game Screen -->
        <div class="screen" id="gameScreen">
            <div class="game-layout">
                <div class="main-game-area">
                    <div class="game-header">
                        <div class="room-code" id="gameRoomCode"></div>
                        <div class="round-info">Round <span id="currentRound">1</span></div>
                    </div>

                    <div class="timer-container">
                        <div class="timer" id="timerDisplay">30</div>
                        <div class="timer-bar">
                            <div class="timer-progress" id="timerProgress"></div>
                        </div>
                    </div>

                    <div class="question-container">
                        <div class="question" id="questionText">Loading question...</div>
                    </div>

                    <div class="answer-section" id="answerSection">
                        <div class="answer-input-container">
                            <input type="text" class="answer-input" id="answerInput" placeholder="Enter your answer..." maxlength="100">
                        </div>
                        <button class="submit-btn" id="submitBtn" onclick="submitAnswer()">Submit Answer</button>
                    </div>

                    <div class="answers-reveal hidden" id="answersReveal">
                        <h3>Answers</h3>
                        <div class="correct-answer-display" id="correctAnswerDisplay" style="background: var(--accent-win); padding: 16px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 1.1em; font-weight: 500;"></div>
                        <div id="answersList"></div>
                        <div id="hostNextControls" class="hidden" style="margin-top: 20px;">
                            <button onclick="nextRound()" style="width: 100%;">Next Round</button>
                        </div>
                    </div>
                </div>

                <div class="sidebar">
                    <div class="scoreboard" id="scoreboard">
                        <div class="scoreboard-title">Scoreboard</div>
                        <div id="scoreboardContent"></div>
                    </div>

                    <div class="players-grid" id="playersGrid"></div>

                    <div class="host-controls hidden" id="hostControls">
                        <h3>Host Controls</h3>
                        <div class="control-group">
                            <label>Auto-next round</label>
                            <div class="toggle-switch" id="autoNextToggle" onclick="toggleAutoNext()"></div>
                        </div>
                        <button onclick="endGame()" style="width: 100%; margin-top: 15px;">End Game</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div class="screen" id="gameOverScreen">
            <div class="glass-card game-over-content">
                <h1>Game Over!</h1>
                <div class="scoreboard" style="max-width: 400px; margin: 0 auto;">
                    <div class="scoreboard-title">Final Scores</div>
                    <div id="finalScores"></div>
                </div>
                <div class="button-group" style="margin-top: 30px;">
                    <button onclick="playAgain()">Play Again</button>
                    <button class="secondary" onclick="backToHome()">Back to Home</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
